name: Fire-TV-App

on:
  push:
    paths:
      - 'firetv-app/**'
      - '.github/workflows/firetv.yml'
  pull_request:
    paths:
      - 'firetv-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firetv-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kabeltv-firetv-debug
          path: firetv-app/app/build/outputs/apk/debug/*.apk
