services:
  kabeltv-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    image: kabeltv-proxy:latest
    container_name: kabeltv-proxy
    restart: unless-stopped
    # host-Netzwerk, damit die RTP-Pakete (UDP) der FRITZ!Box ohne NAT ankommen
    network_mode: host
    environment:
      PORT: "8095"
      FRITZ_HOST: "192.168.177.1"
      AUDIO: "aac"          # aac (empfohlen) oder copy
      VIDEO: "copy"         # copy (empfohlen) oder h264 (rechenintensiv)
      MAX_STREAMS: "2"
      IDLE_SECONDS: "20"
    tmpfs:
      - /tmp/kabeltv
