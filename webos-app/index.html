<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>KabelBox TV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <video id="video" autoplay playsinline></video>

  <!-- Radio / Hintergrund wenn kein Bild -->
  <div id="radio" class="hidden">
    <div class="radio-icon">&#9835;</div>
    <div id="radio-name"></div>
  </div>

  <!-- Laden / Fehler -->
  <div id="status" class="hidden">
    <div id="status-bg">
      <img id="status-logo" class="hidden" alt="">
      <div id="status-logo-name" class="hidden"></div>
    </div>
    <div class="status-box">
      <div class="status-row">
        <div class="spinner"></div>
        <div>
          <div id="status-text"></div>
          <div id="status-step" class="hidden"></div>
        </div>
      </div>
      <div class="loadbar"><div id="status-bar"></div></div>
    </div>
  </div>
  <div id="error" class="hidden">
    <div id="error-title"></div>
    <div id="error-text"></div>
  </div>

  <!-- Nummerneingabe -->
  <div id="numinput" class="hidden"></div>

  <!-- Infoleiste -->
  <div id="infobar" class="hidden">
    <div class="info-row">
      <div id="info-num"></div>
      <div id="info-name"></div>
      <div id="info-list" class="badge"></div>
      <div id="info-demo" class="badge hidden">DEMO</div>
      <div id="info-tuners" class="badge hidden"></div>
      <div id="info-clock"></div>
    </div>
    <div id="info-epg" class="hidden">
      <div class="epg-line"><span class="epg-time" id="info-now-time"></span><span id="info-now-title"></span></div>
      <div class="progress"><div id="info-now-progress"></div></div>
      <div class="epg-line next"><span class="epg-time" id="info-next-time"></span><span id="info-next-title"></span></div>
    </div>
  </div>

  <!-- Senderliste mit Programm -->
  <div id="channels" class="panel hidden">
    <div class="channels-col">
      <div id="tabs"></div>
      <ul id="channel-list"></ul>
      <div class="hint" data-i18n-html="hint.channels"></div>
    </div>
    <div id="epg-detail">
      <h2 id="epg-channel"></h2>
      <div id="epg-events"></div>
    </div>
  </div>

  <!-- Einstellungen -->
  <div id="settings" class="panel hidden">
    <h1 data-i18n="settings.title"></h1>
    <label data-i18n="settings.fritz"></label>
    <input id="set-fritz" class="nav" type="text" placeholder="fritz.box">
    <label data-i18n="settings.lan"></label>
    <div class="segmented" id="set-lan">
      <button class="nav" data-lan="off" data-i18n="settings.off"></button>
      <button class="nav" data-lan="on" data-i18n="settings.on"></button>
    </div>
    <div class="row">
      <button class="nav" id="btn-test" data-i18n="btn.test"></button>
      <button class="nav primary" id="btn-save" data-i18n="btn.save"></button>
      <button class="nav" id="btn-cancel" data-i18n="btn.cancel"></button>
      <button class="nav" id="btn-tutorial" data-i18n="btn.tutorial"></button>
      <button class="nav" id="btn-demo" data-i18n="btn.demo"></button>
    </div>
    <div id="settings-status"></div>
  </div>

  <!-- Hinweis, wenn keine FRITZ!Box antwortet -->
  <div id="nofritz" class="hidden">
    <div class="tut-box">
      <h1 data-i18n="nofritz.title"></h1>
      <p data-i18n-html="nofritz.intro"></p>
      <p data-i18n="nofritz.demo"></p>
      <p id="nofritz-detail"></p>
      <div class="nf-row">
        <button class="nf-btn primary" data-act="demo" data-i18n="btn.demo"></button>
        <button class="nf-btn" data-act="settings" data-i18n="btn.settings"></button>
        <button class="nf-btn" data-act="retry" data-i18n="btn.retry"></button>
      </div>
      <div class="tut-hint" data-i18n-html="nofritz.hint"></div>
    </div>
  </div>

  <!-- Kurze Anleitung beim ersten Start -->
  <div id="tutorial" class="hidden">
    <div class="tut-box">
      <div id="tut-step"></div>
      <h1 id="tut-title"></h1>
      <div id="tut-body"></div>
      <div id="tut-dots"></div>
      <div class="tut-hint" data-i18n-html="tut.hint"></div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/logos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
